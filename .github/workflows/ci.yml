name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {python: '3.10', django: '5.2'}
          - {python: '3.11', django: '5.2'}
          - {python: '3.12', django: '5.2'}
          - {python: '3.12', django: '6.0'}
          - {python: '3.12', django: '6.1'}
          - {python: '3.13', django: '6.1'}
          - {python: '3.14', django: '6.1'}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.9'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv pip install 'Django~=${{ matrix.django }}.0'
      - run: uv run --no-sync ruff check . && uv run --no-sync ruff format --check . && uv run --no-sync mypy
      - run: uv run --no-sync pytest --cov --cov-report=term-missing --cov-report=xml --cov-report=markdown-append:$GITHUB_STEP_SUMMARY
      - run: uv run --no-sync python -m django makemigrations --check --dry-run --settings=tests.settings
      - run: uv build && uv run --no-sync twine check dist/* && uv run --no-sync python scripts/check_package.py
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: vatly
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGDATABASE: vatly
      PGUSER: postgres
      PGPASSWORD: local-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.9'
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv pip install 'psycopg[binary]>=3.2,<4'
      - run: uv run --no-sync pytest
  published-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.9'
          python-version: '3.12'
      - run: >-
          uv run --isolated --no-project --refresh --default-index https://pypi.org/simple
          --with 'vatly-django==0.1.0a3' --with 'pytest>=8,<10'
          --with 'pytest-django>=4.11,<5' python -m pytest -q tests/test_docs.py
