[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "vatly-django"
version = "0.1.0a2"
description = "Billing helpers for Django user and team models, built on Vatly Fluent"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
dependencies = ["Django>=5.2,<6.2", "vatly-fluent-python==0.1.0a2", "vatly-api-python==0.1.0a2"]
classifiers = ["Development Status :: 3 - Alpha", "Framework :: Django", "Typing :: Typed"]

[project.urls]
Homepage = "https://github.com/vatly/vatly-django"
Documentation = "https://docs.vatly.com"
Issues = "https://github.com/vatly/vatly-django/issues"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-django>=4.11,<5",
    "ruff>=0.14,<1",
    "mypy>=1.18,<2",
    "django-stubs>=5.2,<7",
    "twine>=6,<7",
    "pytest-cov>=7,<8",
]

[tool.uv.sources]
vatly-api-python = {path = "vendor/vatly_api_python-0.1.0a2-py3-none-any.whl"}
vatly-fluent-python = {path = "vendor/vatly_fluent_python-0.1.0a2-py3-none-any.whl"}

[tool.hatch.build.targets.wheel]
packages = ["src/vatly_django"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "vendor", "scripts", "docs", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
strict = true
files = ["src/vatly_django"]

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.coverage.run]
branch = true
source = ["vatly_django"]

[tool.coverage.report]
fail_under = 90
show_missing = true
